<style>
/* Layout idea: one phone-width column. A card deck on raw indigo denim; every card carries a selvedge edge (ecru band, red thread). */
:root {
  --denim: #172038;      /* raw indigo, the table everything sits on */
  --denim-2: #222d4d;    /* raised surfaces on denim */
  --ecru: #f1ebdd;       /* card stock, selvedge band */
  --ink: #161a26;        /* text on ecru */
  --thread: #c9382c;     /* selvedge red thread: the one accent */
  --muted: #8b93ab;      /* secondary text on denim */
  --like: #5d7a3a;       /* semantic: like */
  --pass: #5a6074;       /* semantic: pass */
  --line: rgba(241,235,221,.14);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--denim); color: var(--ecru); font: 15px/1.45 var(--body); overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }
.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; overflow: hidden;
  background: repeating-linear-gradient(115deg, transparent 0 3px, rgba(255,255,255,.018) 3px 4px), var(--denim); }

header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
.logo { font: 800 30px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.logo i { width: 9px; height: 26px; background: var(--ecru); border-right: 2px solid var(--thread); display: block; }
.seg { margin-left: auto; display: flex; background: var(--denim-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ecru); color: var(--ink); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: none; font-size: 17px; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; padding: 4px 16px 24px; -webkit-overflow-scrolling: touch; }
.note { font-size: 12px; color: var(--muted); padding: 0 16px 6px; display: flex; gap: 8px; align-items: center; }
.note b { color: var(--ecru); font-weight: 600; }
.cats { display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--ecru); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"], .chip.on { background: var(--ecru); color: var(--ink); border-color: var(--ecru); }
.chip small { color: var(--muted); font-size: 11px; }
.chip.on small, .chip[aria-pressed="true"] small { color: #5a5f70; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }

/* deck */
.deck { flex: 1; min-height: 0; position: relative; margin: 0 16px; }
.card { position: absolute; inset: 0; background: var(--ecru); color: var(--ink); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,.35); touch-action: none; user-select: none; will-change: transform; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--ecru); border-right: 2px solid var(--thread); z-index: 2; }
.card.under { transform: scale(.955) translateY(10px); filter: brightness(.86); }
.card .art { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px 14px 0 26px; position: relative; }
.card .art svg, .card .art img { max-width: 100%; max-height: 100%; height: 100%; object-fit: contain; }
.card .info { padding: 10px 16px 14px 28px; display: flex; flex-direction: column; gap: 6px; }
.card .brand { font: 800 27px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: baseline; gap: 10px; }
.card .brand span { margin-left: auto; font: 700 20px/1 var(--body); font-variant-numeric: tabular-nums; }
.card .title { font-weight: 500; }
.card .meta { font-size: 13px; color: #5a5f70; }
.why { display: flex; flex-wrap: wrap; gap: 5px; }
.why span { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: rgba(22,26,38,.08); }
.why .s { background: var(--thread); color: #fff; }
.why .g { background: var(--like); color: #fff; }
.match { position: absolute; top: 12px; right: 12px; background: var(--ink); color: var(--ecru); font: 800 20px/1 var(--display); padding: 6px 9px; border-radius: 9px; letter-spacing: .03em; }
.match small { font: 600 10px/1 var(--body); display: block; letter-spacing: .06em; opacity: .7; margin-top: 2px; }
.stamp { position: absolute; top: 26px; font: 800 38px/1 var(--display); letter-spacing: .06em; padding: 4px 12px; border: 4px solid; border-radius: 10px; opacity: 0; z-index: 3; text-transform: uppercase; }
.stamp.l { left: 30px; color: var(--like); transform: rotate(-12deg); }
.stamp.p { right: 20px; color: var(--thread); transform: rotate(12deg); }
.stamp.o { left: 50%; top: auto; bottom: 46%; transform: translateX(-50%); color: var(--ink); background: var(--ecru); }
.back { position: absolute; inset: 0 0 0 14px; background: var(--ecru); padding: 18px 16px; overflow-y: auto; z-index: 1; display: none; }
.card.flipped .back { display: block; }
.back h3 { font: 800 22px/1.1 var(--display); text-transform: uppercase; margin: 0 0 8px; }
.back h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5a5f70; margin: 14px 0 6px; }
.back p { margin: 0 0 6px; }
.back dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; font-size: 14px; }
.back dt { color: #5a5f70; } .back dd { margin: 0; font-variant-numeric: tabular-nums; }
.pair { display: flex; gap: 8px; overflow-x: auto; }
.pair div { flex: none; width: 76px; font-size: 11px; text-align: center; line-height: 1.2; }
.pair svg, .pair img { width: 76px; height: 76px; background: rgba(22,26,38,.06); border-radius: 10px; object-fit: cover; }

.actions { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 12px 16px 10px; }
.act { border: 0; border-radius: 50%; width: 62px; height: 62px; font-size: 26px; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.act.sm { width: 46px; height: 46px; font-size: 18px; background: var(--denim-2); color: var(--ecru); }
.act.no { background: var(--ecru); color: var(--thread); }
.act.yes { background: var(--like); color: #fff; }
.act:active { transform: scale(.94); }
.empty { text-align: center; margin: auto; padding: 24px; color: var(--muted); max-width: 320px; }
.empty h2 { font: 800 28px/1.05 var(--display); text-transform: uppercase; color: var(--ecru); margin: 0 0 8px; text-wrap: balance; }

.why-bar { position: absolute; left: 12px; right: 12px; top: 58px; background: var(--ecru); color: var(--ink); border-radius: 14px; padding: 10px 12px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.why-bar p { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; }
.why-bar p button { margin-left: auto; border: 0; background: none; color: var(--thread); font-weight: 700; }
.why-bar .wrap { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.why-bar p button { white-space: nowrap; }
.why-bar .chip { color: var(--ink); border-color: rgba(22,26,38,.25); padding: 7px 11px; }
.why-bar .chip.on { background: var(--ink); color: var(--ecru); border-color: var(--ink); }

/* lists */
h2.sec { font: 800 22px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 22px 0 4px; }
h2.sec:first-child { margin-top: 6px; }
p.sub { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; max-width: 65ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }
.tile { background: var(--ecru); color: var(--ink); border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; border-left: 6px solid var(--ecru); box-shadow: inset 2px 0 0 var(--thread); }
.tile .pic { aspect-ratio: 1; display: grid; place-items: center; padding: 8px; }
.tile .pic svg, .tile .pic img { width: 100%; height: 100%; object-fit: contain; }
.tile .t { padding: 0 9px 9px; font-size: 12.5px; line-height: 1.3; }
.tile .t b { display: block; font: 800 16px/1.1 var(--display); text-transform: uppercase; }
.tile .x { position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(22,26,38,.75); color: #fff; font-size: 13px; }
.tile .plus { margin: 0 9px 9px; border: 1px solid rgba(22,26,38,.25); background: none; color: var(--ink); border-radius: 8px; padding: 6px; font-size: 12.5px; font-weight: 600; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--ecru); color: var(--ink); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ecru); }
.btn.red { background: var(--thread); color: #fff; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar { display: grid; grid-template-columns: 150px 1fr 38px; gap: 10px; align-items: center; font-size: 13.5px; margin-bottom: 6px; }
.bar i { height: 10px; border-radius: 5px; background: var(--denim-2); display: block; overflow: hidden; }
.bar i b { display: block; height: 100%; background: var(--ecru); border-right: 2px solid var(--thread); }
.bar span { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.sw { display: inline-flex; align-items: center; gap: 7px; }
.sw i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); display: block; }
.outfit { background: var(--denim-2); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.outfit h3 { font: 800 20px/1.1 var(--display); text-transform: uppercase; margin: 0; }
.outfit .look { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; }
.outfit .look .tile { flex: none; width: 112px; }
.next { background: var(--denim-2); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.next h3 { margin: 0 0 2px; font-size: 15px; } .next p { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }

nav { display: flex; border-top: 1px solid var(--line); background: var(--denim); }
nav button { flex: 1; border: 0; background: none; padding: 9px 2px 11px; font-size: 11.5px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="page"] { color: var(--ecru); }
nav button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; background: var(--thread); }
nav .n { position: absolute; top: 4px; left: 54%; background: var(--thread); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; min-width: 16px; }

.scrim { position: absolute; inset: 0; background: rgba(8,11,22,.6); z-index: 30; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 86%; overflow-y: auto; background: var(--ecru); color: var(--ink); border-radius: 18px 18px 0 0; padding: 18px 16px 22px; }
.sheet h2 { font: 800 24px/1.1 var(--display); text-transform: uppercase; margin: 0 0 4px; }
.sheet p { margin: 0 0 12px; color: #5a5f70; font-size: 13.5px; }
.sheet label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin: 12px 0 4px; color: #5a5f70; }
.sheet input[type=text], .sheet select { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid rgba(22,26,38,.3); background: #fff; color: var(--ink); font-size: 16px; }
.sheet .opt { display: flex; width: 100%; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid rgba(22,26,38,.2); background: none; color: var(--ink); margin-bottom: 8px; font-weight: 600; }
.sheet .opt small { margin-left: auto; font-weight: 400; color: #5a5f70; }
.sheet .btn { background: var(--ink); color: var(--ecru); width: 100%; margin-top: 14px; }
.sheet .btn.ghost { background: none; color: var(--ink); border-color: rgba(22,26,38,.3); }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ecru); color: var(--ink); padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 40; box-shadow: 0 6px 18px rgba(0,0,0,.4); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .card.fly { transition: transform .28s ease-in, opacity .28s; } .card.snap { transition: transform .22s cubic-bezier(.2,1.3,.5,1); } .card.under { transition: transform .2s, filter .2s; } }
</style>
</head>

}
function rank(pairs) {
  if (mode === 'stretch') return pairs.filter(p => p[0].stretch.length).sort((a, b) => (b[0].stretch.length * 2 + b[0].score) - (a[0].stretch.length * 2 + a[0].score)).map(p => p[1].id);
  const safe = pairs.filter(p => !p[0].stretch.length).sort((a, b) => b[0].score - a[0].score);
  const str = pairs.filter(p => p[0].stretch.length).sort((a, b) => b[0].score - a[0].score);
  const out = [];
  while (safe.length || str.length) { // two familiar picks, then one that stretches
    for (let i = 0; i < 2 && safe.length; i++) out.push(safe.shift()[1].id);
    if (str.length) out.push(str.shift()[1].id);
  }
  return out;
}

function decide(dir) {
  const id = queue && queue[0];
  if (!id) return;
  const el = document.querySelector('#deck .card:not(.under)');
  const done = () => {
    history.push(id); flipped = false;
    const msg = vote(id, dir === 'left' ? -1 : 1, []);
    queue.shift(); buildQueue(queue[0]);
    render();
    if (dir === 'left') whyBar(id); else { closeWhy(); toast(msg || 'Liked'); }
    if (dir === 'up') pickOutfit({ k: 'shop', id });
  };
  if (!el) return done();
  el.classList.add('fly');
  el.style.transform = dir === 'left' ? 'translate(-140%, 30px) rotate(-22deg)' : dir === 'right' ? 'translate(140%, 30px) rotate(22deg)' : 'translate(0, -130%)';
  el.style.opacity = '0';
  setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 240);
}
function bindSwipe() {
  const el = document.querySelector('#deck .card:not(.under)');
  if (!el) return;
  if (flipped) el.classList.add('flipped');
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false, moved = false;
  const stamps = el.querySelectorAll('.stamp');
  el.addEventListener('pointerdown', e => { down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; el.classList.remove('snap'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
    if (flipped || !moved) return;
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx / 18 + 'deg)';
    const up = dy < -60 && Math.abs(dx) < 70;
    stamps[0].style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 90));
    stamps[1].style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 90));
    stamps[2].style.opacity = up ? Math.min(1, (-dy - 60) / 60) : 0;
  });
  const end = () => {
    if (!down) return; down = false;
    if (!moved) { flipped = !flipped; el.classList.toggle('flipped', flipped); return; }
    if (flipped) return;
    if (dy < -120 && Math.abs(dx) < 70) return decide('up');
    if (dx > 95) return decide('right');
    if (dx < -95) return decide('left');
    el.classList.add('snap'); el.style.transform = ''; stamps.forEach(s => { s.style.opacity = 0; });
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

}

// ------------------------------------------------------------------ shell
const TABS = [['discover', 'Discover', 'M5 5h11v14H5z M9 3h11v14'], ['likes', 'Likes', 'M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.4-7 10-7 10z'], ['outfits', 'Outfits', 'M12 6a2 2 0 1 1 2-2 M12 6v2l8 6v2H4v-2l8-6'], ['closet', 'Closet', 'M5 3h14v18H5z M12 3v18 M9.5 11v2 M14.5 11v2'], ['style', 'Style', 'M4 19h16 M7 19V9 M12 19V5 M17 19v-7']];
function render() {
  document.getElementById('mode').innerHTML = [['you', 'For you'], ['stretch', 'Stretch']].map(m => '<button data-act="mode" data-v="' + m[0] + '" aria-pressed="' + (mode === m[0]) + '">' + m[1] + '</button>').join('');
  document.getElementById('mode').style.visibility = tab === 'discover' ? 'visible' : 'hidden';
  const likes = Object.values(S.votes).filter(v => v.v > 0).length;
  document.getElementById('nav').innerHTML = TABS.map(t => '<button data-act="tab" data-v="' + t[0] + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24"><path d="' + t[2] + '"/></svg>' + t[1] + (t[0] === 'likes' && likes ? '<span class="n">' + likes + '</span>' : '') + '</button>').join('');
  const main = document.getElementById('main'), sc = main.querySelector('.scroll'), keep = sc ? sc.scrollTop : 0;
  main.innerHTML = tab === 'discover' ? viewDiscover() : tab === 'likes' ? viewLikes() : tab === 'outfits' ? viewOutfits() : tab === 'closet' ? viewCloset() : viewStyle();
  const sc2 = main.querySelector('.scroll'); if (sc2) sc2.scrollTop = keep;
  if (tab === 'discover') bindSwipe();
}
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('.scrim')) return;
  const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  if (a === 'tab') { tab = v; closeWhy(); render(); const s = document.querySelector('.scroll'); if (s) s.scrollTop = 0; }
  else if (a === 'mode') { mode = v; queue = null; flipped = false; render(); }
  else if (a === 'cat') { cat = v; queue = null; flipped = false; render(); }
  else if (a === 'like') decide('right');
  else if (a === 'pass') decide('left');
  else if (a === 'up') decide('up');
  else if (a === 'flip') { flipped = !flipped; const c = document.querySelector('#deck .card:not(.under)'); if (c) c.classList.toggle('flipped', flipped); }
  else if (a === 'undo') { const last = history.pop(); if (last) { closeWhy(); unvote(last); flipped = false; buildQueue(last); render(); } }
  else if (a === 'repass') { Object.keys(S.votes).forEach(i => { if (S.votes[i].v < 0) unvote(i); }); queue = null; render(); }
  else if (a === 'settings') settings();
  else if (a === 'unlike') { unvote(id); queue = null; render(); }
  else if (a === 'outfit-add') pickOutfit({ k: b.dataset.k, id });
  else if (a === 'outfit-new') { S.outfits.push({ id: 'o' + Date.now(), name: 'Outfit ' + (S.outfits.length + 1), pieces: [] }); save(); render(); }
  else if (a === 'outfit-pick') pickPiece(id);
  else if (a === 'outfit-del') { S.outfits = S.outfits.filter(o => o.id !== id); save(); render(); }
  else if (a === 'outfit-rm') { const [oid, k] = b.dataset.o.split('|'), o = S.outfits.find(x => x.id === oid); o.pieces = o.pieces.filter(p => !(p.k === k && p.id === id)); save(); render(); }
  else if (a === 'closet-new') closetForm();
  else if (a === 'closet-del') { S.closet = S.closet.filter(c => c.id !== id); S.outfits.forEach(o => { o.pieces = o.pieces.filter(p => !(p.k === 'own' && p.id === id)); }); savePhoto(id, null); save(); queue = null; render(); }
  else if (a === 'curious') { S.curious = S.curious.includes(v) ? S.curious.filter(x => x !== v) : S.curious.concat(v); save(); queue = null; render(); }
});
document.addEventListener('keydown', e => {
  if (tab !== 'discover' || sheetEl || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') decide('right'); else if (e.key === 'ArrowLeft') decide('left'); else if (e.key === 'ArrowUp') decide('up');
});
render();
cloudInit();
})();
</script>
